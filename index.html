<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation Exercise</title>
    <script src="./script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Form Validation</h1>

    <form novalidate>
        <label for="userEmail">Email: </label>
        <input type="email" id="userEmail" name="email" placeholder="name@example.com" required>
        <span class="error" id="userEmail-error"></span>

        <label for="country">Country: </label>
        <select id="country" name="country" required>
            <option value="" disabled selected>Select a country</option>
            <option value="US">United States</option>
            <option value="CA">Canada</option>
            <option value="GB">United Kingdom</option>
            <option value="AU">Australia</option>
        </select>
        <span class="error" id="country-error"></span>

        <label for="postal-code">Postal Code: </label>
        <input type="text" id="postal-code" name="postal_code" required>
        <span class="error" id="postal-code-error"></span>
        
        <label for="pwd">Password: </label>
        <input type="password" id="pwd" name="password" required>
        <span class="error" id="pwd-error"></span>

        <label for="pwd-confirm">Password Confirmation: </label>
        <input type="password" id="pwd-confirm" name="pwd-confirm" required>
        <span class="error" id="pwd-confirm-error"></span>

        <button type="submit">submit</button>
        <p></p>
        <p id="form-status"></p>
    </form>


</body>
</html>
